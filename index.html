<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ItemFIND - Download</title>
    <style>
        /* Allgemeine Seitengestaltung */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 40px 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #00adb5;
        }

        p {
            font-size: 1.2rem;
            color: #eeeeee;
            margin-bottom: 40px;
        }

        /* Einheits-Styling für alle Buttons */
        .btn {
            display: inline-block;
            background-color: #00adb5;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 35px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 173, 181, 0.4);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            cursor: pointer;
        }

        /* Hover-Effekt für die Buttons */
        .btn:hover {
            background-color: #393e46;
            color: #00adb5;
            border-color: #00adb5;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 173, 181, 0.6);
        }

        /* Klick-Effekt */
        .btn:active {
            transform: translateY(-1px);
        }

        /* Bereich für zusätzliche Buttons (z.B. Support oder Info) */
        .button-group {
            margin-top: 20px;
        }
        
        .btn-secondary {
            background-color: #393e46;
            border: 2px solid #222831;
            box-shadow: none;
            margin: 10px;
        }
        
        .btn-secondary:hover {
            background-color: #222831;
            border-color: #eeeeee;
            color: #eeeeee;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ItemFIND</h1>
        <p>Finde deine Sachen im Handumdrehen. Lade dir jetzt die neueste Version unserer App als APK herunter.</p>
        
        <a href="deine-app.apk" class="btn" download>APK Herunterladen</a>

        <div class="button-group">
            <a href="#features" class="btn btn-secondary">Funktionen</a>
            <a href="#support" class="btn btn-secondary">Support</a>
        </div>
    </div>

</body>
</html>
